# API_ORIGIN (the Cloud Run URL) is read by next.config.mjs at build time:
# set it in the Netlify site's environment variables, then redeploy.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

# Serves .next as pages and functions; without it every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
